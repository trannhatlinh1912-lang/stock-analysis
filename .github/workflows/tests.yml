name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stock-technical:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .claude/skills/stock-technical
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        # Modules import vnstock lazily (inside functions), so the unit tests
        # need only the data libs — no network client required.
        run: pip install pandas numpy pyyaml

      - name: Run unit tests (strict invariants)
        env:
          STOCK_STRICT: "1"
        run: python -m unittest discover -s tests -v
